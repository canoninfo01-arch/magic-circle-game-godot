name: Android Debug Build (test)

on:
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6.3

    steps:
      - uses: actions/checkout@v4

      - name: Install Japanese font
        run: |
          apt-get update -qq
          apt-get install -y -qq fonts-ipafont-gothic
          mkdir -p fonts
          cp "$(find /usr/share/fonts -name "ipag.ttf" | head -1)" fonts/jp_font.ttf

      - name: Download Android export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.6.3.stable
          wget -q "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz" -O templates.tpz
          unzip -q templates.tpz -d templates_extracted
          mv templates_extracted/templates/* ~/.local/share/godot/export_templates/4.6.3.stable/

      - name: Copy image's pre-baked Godot editor settings
        # GitHub Actions container jobs run with HOME=/github/home, but the
        # barichello/godot-ci image's correct java_sdk_path / android_sdk_path /
        # debug_keystore config lives at /root/.config/godot (the image's actual
        # root home). Copy it into the effective HOME so Godot picks it up.
        run: |
          mkdir -p "$HOME/.config"
          cp -r /root/.config/godot "$HOME/.config/godot"

      - name: Pre-heat asset cache
        run: godot --headless --verbose --editor --quit || true

      - name: Diagnose Android SDK contents
        run: |
          echo "--- whoami / id ---"
          whoami; id
          echo "--- debug.keystore ---"
          ls -la /root/debug.keystore 2>&1 || echo "(no debug.keystore)"
          echo "--- cmdline-tools ---"
          ls -la /usr/lib/android-sdk/cmdline-tools/ 2>&1 || echo "(no cmdline-tools)"
          echo "--- android_sdk_path setting file content ---"
          cat "$HOME/.config/godot/editor_settings-4.6.tres" | grep -i "android\|java"
          echo "--- java check ---"
          java -version 2>&1
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Export Android debug APK
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-debug "Android" build/android/sigil-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sigil-debug-apk
          path: build/android/sigil-debug.apk
