name: Android Debug Build (test)

on:
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6.3

    steps:
      - uses: actions/checkout@v4

      - name: Install Japanese font
        run: |
          apt-get update -qq
          apt-get install -y -qq fonts-ipafont-gothic
          mkdir -p fonts
          cp "$(find /usr/share/fonts -name "ipag.ttf" | head -1)" fonts/jp_font.ttf

      - name: Download Android export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.6.3.stable
          wget -q "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz" -O templates.tpz
          unzip -q templates.tpz -d templates_extracted
          mv templates_extracted/templates/* ~/.local/share/godot/export_templates/4.6.3.stable/

      - name: Pre-heat asset cache
        run: godot --headless --verbose --editor --quit || true

      - name: Diagnose Java install
        run: |
          ls -la /usr/lib/jvm/ || true
          which java || true
          java -version || true
          readlink -f "$(which java)" || true

      - name: Export Android debug APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-8-openjdk-amd64
        run: |
          mkdir -v -p build/android
          godot --headless --verbose --export-debug "Android" build/android/sigil-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sigil-debug-apk
          path: build/android/sigil-debug.apk
