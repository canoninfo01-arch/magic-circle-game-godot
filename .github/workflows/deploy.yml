name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Download Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Download export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.6.3.stable
          wget -q "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz" -O templates.tpz
          unzip -q templates.tpz -d templates_extracted
          mv templates_extracted/templates/* ~/.local/share/godot/export_templates/4.6.3.stable/

      - name: Export Web
        run: |
          mkdir -p build
          godot --headless --export-release "Web" build/index.html

      - name: Add COOP/COEP service worker (GitHub Pages 対応)
        run: |
          cat > build/coi-sw.js << 'SWEOF'
          self.addEventListener("install", () => self.skipWaiting());
          self.addEventListener("activate", e => e.waitUntil(self.clients.claim()));
          self.addEventListener("fetch", e => {
            if (e.request.cache === "only-if-cached" && e.request.mode !== "same-origin") return;
            e.respondWith(fetch(e.request).then(r => {
              if (r.status === 0) return r;
              const h = new Headers(r.headers);
              h.set("Cross-Origin-Opener-Policy", "same-origin");
              h.set("Cross-Origin-Embedder-Policy", "require-corp");
              return new Response(r.body, {status: r.status, statusText: r.statusText, headers: h});
            }));
          });
          SWEOF

          SCRIPT='<script>if(!window.crossOriginIsolated&&"serviceWorker"in navigator){navigator.serviceWorker.register("coi-sw.js").then(r=>{if(r.installing||r.waiting){navigator.serviceWorker.addEventListener("controllerchange",()=>location.reload())}});}</script>'
          sed -i "s|</head>|${SCRIPT}</head>|" build/index.html
          echo "SW size: $(wc -c < build/coi-sw.js) bytes"
          echo "HTML head check: $(grep -c 'coi-sw' build/index.html) injection(s)"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
