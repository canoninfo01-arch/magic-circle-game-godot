name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Download Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          mv Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Download export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.6.3.stable
          wget -q "https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz" -O templates.tpz
          unzip -q templates.tpz -d templates_extracted
          mv templates_extracted/templates/* ~/.local/share/godot/export_templates/4.6.3.stable/

      - name: Install Japanese font
        run: |
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p fonts
          FONT_PATH=$(find /usr/share/fonts -name "NotoSansCJKjp-Regular.otf" 2>/dev/null | head -1)
          if [ -z "$FONT_PATH" ]; then
            FONT_PATH=$(find /usr/share/fonts \( -name "*.otf" -o -name "*.ttf" \) | grep -i "noto" | grep -i "jp\|cjk" | head -1)
          fi
          echo "Using font: $FONT_PATH"
          cp "$FONT_PATH" fonts/jp_font.otf

      - name: Export Web
        run: |
          mkdir -p build
          godot --headless --export-release "Web" build/index.html

      - name: Add COOP/COEP service worker (GitHub Pages 対応)
        run: |
          cp coi-sw.js build/coi-sw.js
          python3 inject_sw.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
